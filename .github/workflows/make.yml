---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115
      - feature/macos-thumbnail-activation-v116
      - feature/macos-thumbnail-hover-v117
      - feature/macos-input-routing-v121
      - feature/macos-input-stability-v122
      - feature/macos-direct-input-v123
      - feature/macos-proxy-input-v124
      - feature/macos-root-layout-v127
      - feature/macos-unified-fisheye-v128

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macTrayLayout.js
          node --check macThumbnailFisheyeBase.js
          node --check macThumbnailFisheye.js
          node --check macInputIntegrity.js
          node --check macDirectInputStability.js
          node --check macPrefs.js
          node --check prefs.js
          node --check tests/macosGeometry.test.js
          node --check tests/macosArchitecture.test.js

      - name: Verify unified layout ownership
        run: node --experimental-default-type=module tests/macosArchitecture.test.js

      - name: Test unified Dock geometry
        run: node --experimental-default-type=module tests/macosGeometry.test.js

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macTrayLayout.js
          test -f _build/macThumbnailFisheyeBase.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macInputIntegrity.js
          test -f _build/macDirectInputStability.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v128'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v128-unified-fisheye** artifact below.'
            echo ''
            echo '- apps, previews, Trash/mounts and Show Apps share one fish-eye field'
            echo '- every target uses its final canonical base center before spring integration'
            echo '- balanced current-scale offsets preserve every adjacent visual gap'
            echo '- no post-paint boundary movement or previous-frame geometry feedback remains'
            echo '- stable input proxies remain separate from animated visual geometry'
            echo '- heterogeneous, multi-preview, extreme-radius and vertical geometry are tested'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v128-unified-fisheye
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
