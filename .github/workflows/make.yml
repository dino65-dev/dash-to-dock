---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115
      - feature/macos-thumbnail-activation-v116
      - feature/macos-thumbnail-hover-v117
      - feature/macos-input-routing-v121
      - feature/macos-input-stability-v122
      - feature/macos-direct-input-v123
      - feature/macos-proxy-input-v124

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macThumbnailFisheyeBase.js
          node --check macThumbnailFisheye.js
          node --check macInputIntegrity.js
          node --check macDirectInputStability.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Verify stable input architecture
        run: |
          grep -q 'previous.baseRect.x + previous.baseRect.width' macDirectInputStability.js
          grep -q 'actor.reactive = false' macDirectInputStability.js
          grep -q 'state.trayInputRect' macDirectInputStability.js
          grep -q '_createSpecialProxy' macDirectInputStability.js
          grep -q 'item.app.activate' macDirectInputStability.js
          if grep -q 'previous.baseRect.x + previous.offset' macDirectInputStability.js; then
            echo 'moving tray anchor regression detected'
            exit 1
          fi

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macThumbnailFisheyeBase.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macInputIntegrity.js
          test -f _build/macDirectInputStability.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v124'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v124-stable-proxy-input** artifact below.'
            echo ''
            echo '- thumbnail visuals are non-reactive and cannot move their own hover target'
            echo '- one stable tray proxy owns thumbnail hover and activation'
            echo '- tray base geometry no longer includes the preceding app spring offset'
            echo '- reserved magnification space prevents the preceding app from overlapping the tray'
            echo '- Trash/locations and Show Apps use dedicated final-visual reactive proxies'
            echo '- location/Trash primary activation calls the location app directly'
            echo '- old special-item stage capture is bypassed; normal app overflow capture remains'
            echo '- v122 effective centers, DND geometry and floating lifecycle remain intact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v124-stable-proxy-input
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
