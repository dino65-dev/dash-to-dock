---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macThumbnailFisheye.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v115'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v115-thumbnail-fisheye** artifact below.'
            echo ''
            echo '- minimized windows participate in configured fish-eye magnification'
            echo '- same raised-cosine field and damped spring as normal Dock items'
            echo '- edge-anchored scaling with dynamic tray spacing'
            echo '- v114 interactions and v113 renderer remain unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v115-thumbnail-fisheye
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
