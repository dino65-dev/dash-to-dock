---
name: Build & Package

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-fisheye
      - feature/macos-material-v108
      - feature/macos-polish-v109
      - feature/macos-polish-v110
      - feature/macos-polish-v111

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check native renderer JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## macOS Native Dock v110 — final visual/scroll polish'
            echo ''
            echo 'Download **dash-to-dock-macos-native-v110-polish** below.'
            echo ''
            echo '- clip native background blur to its actor allocation'
            echo '- keep Blur My Shell dock background suppressed in Mac mode'
            echo '- unit-aware touchpad and mouse-wheel scrolling in macOS preferences'
            echo '- bound per-event scroll deltas to prevent overshoot'
            echo '- v109 behavior otherwise unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v110-polish
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
