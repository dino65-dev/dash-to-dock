---
name: Build & Package

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-fisheye
      - feature/macos-material-v108
      - feature/macos-polish-v109

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check native renderer JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## macOS Native Dock v108 — material and shelf test'
            echo ''
            echo 'Download **dash-to-dock-macos-native-v108-material** below.'
            echo ''
            echo '- pure rounded shell: rectangular box shadow removed'
            echo '- inset compositor frosted-glass blur core'
            echo '- adaptive light/dark tint and contrast border'
            echo '- bottom-dock icon reflections via Clutter.Clone'
            echo '- structural location / folder / Trash divider'
            echo '- dedicated macOS controls in Dash-to-Dock preferences'
            echo '- v107 working branch remains untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v108-material
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
