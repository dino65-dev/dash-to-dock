---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115
      - feature/macos-thumbnail-activation-v116
      - feature/macos-thumbnail-hover-v117
      - feature/macos-input-routing-v121
      - feature/macos-input-stability-v122
      - feature/macos-direct-input-v123
      - feature/macos-proxy-input-v124
      - feature/macos-root-layout-v127

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macTrayLayout.js
          node --check macThumbnailFisheyeBase.js
          node --check macThumbnailFisheye.js
          node --check macInputIntegrity.js
          node --check macDirectInputStability.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Verify root layout ownership
        run: |
          grep -q 'computeTrayLayout' macDockInteractions.js
          grep -q 'boundaryShift = desiredBoundaryStart - nativeBoundaryStart' macTrayLayout.js
          grep -q 'state.shiftAmount = layout.boundaryShift' macDockInteractions.js
          grep -q 'computeTrailingOverlapGuard' macThumbnailFisheyeBase.js

          if grep -q 'totalPreviewExtent' macDockInteractions.js; then
            echo 'old additive tray-width shift returned'
            exit 1
          fi
          if grep -q '_replaceThumbnailLayout' macDirectInputStability.js; then
            echo 'input layer owns thumbnail layout again'
            exit 1
          fi
          if grep -q '_positionThumbnails(renderer' macDirectInputStability.js; then
            echo 'input layer positions thumbnails again'
            exit 1
          fi
          if grep -q 'cumulativeGrowth' macThumbnailFisheyeBase.js; then
            echo 'fish-eye growth owns tray layout again'
            exit 1
          fi
          if grep -q 'actor.set_position' macThumbnailFisheyeBase.js; then
            echo 'fish-eye translates thumbnail actors again'
            exit 1
          fi

      - name: Test canonical tray geometry
        run: |
          cp macTrayLayout.js /tmp/macTrayLayout.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            computeTrayLayout,
            computeTrailingOverlapGuard,
            TRAILING_GAP,
          } from '/tmp/macTrayLayout.mjs';

          function horizontal(count, nativeBoundaryX) {
            const previewSizes = Array.from({length: count}, (_, i) => ({
              width: 52 + i * 7,
              height: 32,
            }));
            const layout = computeTrayLayout({
              horizontal: true,
              previousRect: {x: 400, y: 30, width: 48, height: 48},
              previousCenterX: 424,
              previousCenterY: 54,
              previewSizes,
              boundaryRect: {x: nativeBoundaryX, y: 30, width: 48, height: 48},
            });
            const finalBoundary = nativeBoundaryX + layout.boundaryShift;
            assert.equal(finalBoundary, layout.trayBounds.maxX + TRAILING_GAP);
            return layout;
          }

          for (const count of [1, 2, 3, 5]) {
            for (const nativeX of [500, 550, 700])
              horizontal(count, nativeX);
          }

          const negative = horizontal(1, 700);
          assert.ok(negative.boundaryShift < 0,
            'must absorb an oversized native separator gap');
          const positive = horizontal(3, 500);
          assert.ok(positive.boundaryShift > 0,
            'must also make room when the native boundary is too close');

          const vertical = computeTrayLayout({
            horizontal: false,
            previousRect: {x: 20, y: 300, width: 48, height: 48},
            previousCenterX: 44,
            previousCenterY: 324,
            previewSizes: [{width: 32, height: 55}, {width: 32, height: 61}],
            boundaryRect: {x: 20, y: 520, width: 48, height: 48},
          });
          assert.equal(520 + vertical.boundaryShift,
            vertical.trayBounds.maxY + TRAILING_GAP);

          assert.equal(computeTrailingOverlapGuard({
            horizontal: true,
            previewRect: {x: 100, y: 0, width: 80, height: 40},
            boundaryRect: {x: 184, y: 0, width: 48, height: 48},
            minGap: 6,
          }), 2);
          assert.equal(computeTrailingOverlapGuard({
            horizontal: true,
            previewRect: {x: 100, y: 0, width: 70, height: 40},
            boundaryRect: {x: 184, y: 0, width: 48, height: 48},
            minGap: 6,
          }), 0);

          console.log('canonical tray layout invariants passed');
          NODE

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macTrayLayout.js
          test -f _build/macThumbnailFisheyeBase.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macInputIntegrity.js
          test -f _build/macDirectInputStability.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v127'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v127-root-layout** artifact below.'
            echo ''
            echo '- one canonical layout owns app → thumbnails → Trash/Show Apps geometry'
            echo '- native separator spacing is absorbed instead of added to tray width'
            echo '- trailing system displacement is an absolute delta and may be negative'
            echo '- input proxies no longer position thumbnails or system items'
            echo '- thumbnail fish-eye changes scale only and cannot rewrite base layout'
            echo '- only real transformed overlap can add a temporary trailing guard'
            echo '- 1/2/3/5-preview and horizontal/vertical geometry invariants are CI tested'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v127-root-layout
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
