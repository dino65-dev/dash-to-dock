---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115
      - feature/macos-thumbnail-activation-v116
      - feature/macos-thumbnail-hover-v117

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macThumbnailFisheyeBase.js
          node --check macThumbnailFisheye.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macThumbnailFisheyeBase.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v117'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v117-thumbnail-hover** artifact below.'
            echo ''
            echo '- minimized thumbnails extend the native Dock hover/autohide state'
            echo '- stationary pointer over a thumbnail keeps the Dock visible indefinitely'
            echo '- leaving a thumbnail resynchronizes real pointer hover and normal hide delay'
            echo '- final HIDDEN state force-hides/resets detached thumbnails'
            echo '- v116 activation, v115 fish-eye base, v114 interactions and v113 renderer unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v117-thumbnail-hover
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
