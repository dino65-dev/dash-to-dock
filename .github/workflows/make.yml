---
name: Build & Package

'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci
      - feature/macos-interactions-v114
      - feature/macos-thumbnail-fisheye-v115
      - feature/macos-thumbnail-activation-v116
      - feature/macos-thumbnail-hover-v117
      - feature/macos-input-routing-v121
      - feature/macos-input-stability-v122
      - feature/macos-direct-input-v123
      - feature/macos-proxy-input-v124
      - feature/macos-static-tray-v126

permissions:
  contents: read

jobs:
  build:
    name: Build GNOME extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Clean build tree
        run: make clean

      - name: Compile extension
        run: make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macDockInteractions.js
          node --check macThumbnailFisheyeBase.js
          node --check macThumbnailFisheye.js
          node --check macInputIntegrity.js
          node --check macDirectInputStability.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Verify stable input architecture
        run: |
          grep -q 'previous.baseRect.x + previous.baseRect.width' macDirectInputStability.js
          grep -q 'actor.reactive = false' macDirectInputStability.js
          grep -q 'state.trayInputRect' macDirectInputStability.js
          grep -q '_createSpecialProxy' macDirectInputStability.js
          grep -q 'item.app.activate' macDirectInputStability.js
          if grep -q 'previous.baseRect.x + previous.offset' macDirectInputStability.js; then
            echo 'moving tray anchor regression detected'
            exit 1
          fi

      - name: Verify compact static tray architecture
        run: |
          grep -q 'const BOUNDARY_MIN_GAP = 6' macThumbnailFisheyeBase.js
          grep -q 'actor.set_scale(previewState.scale, previewState.scale)' macThumbnailFisheyeBase.js
          grep -q '_boundaryGuard(renderer, state, preview, boundary, maxScale)' macThumbnailFisheyeBase.js
          grep -q 'state.shiftAmount += boundaryGuard' macThumbnailFisheyeBase.js
          grep -q 'Keep state.trayBounds from the compact v124 layout' macThumbnailFisheyeBase.js
          if grep -q 'cumulativeGrowth\|cumulativeSlotGrowth\|slotGrowth' macThumbnailFisheyeBase.js; then
            echo 'thumbnail growth is affecting long-axis layout again'
            exit 1
          fi
          if grep -q 'actor.set_position' macThumbnailFisheyeBase.js; then
            echo 'thumbnail fish-eye is translating visual slots again'
            exit 1
          fi
          if grep -q 'state.trayBounds =' macThumbnailFisheyeBase.js; then
            echo 'thumbnail spring is rewriting compact material bounds again'
            exit 1
          fi

      - name: Lint JavaScript
        run: make check

      - name: Build installable package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macDockInteractions.js
          test -f _build/macThumbnailFisheyeBase.js
          test -f _build/macThumbnailFisheye.js
          test -f _build/macInputIntegrity.js
          test -f _build/macDirectInputStability.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/stylesheet.css
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Write build summary
        run: |
          {
            echo '## Dash to Dock — macOS Native v126'
            echo ''
            echo 'Download the **dash-to-dock-macos-native-v126-static-compact-tray** artifact below.'
            echo ''
            echo '- based directly on the working v124 compact tray, not v125 spacing'
            echo '- thumbnail actors keep their compact base positions during magnification'
            echo '- thumbnail spring changes compositor scale only; no cumulative translation'
            echo '- no maximum-size slot is reserved between minimized thumbnails'
            echo '- only the final thumbnail/system boundary receives a fixed overlap guard'
            echo '- boundary guard subtracts the real compact base gap before adding space'
            echo '- material bounds remain the compact v124 tray bounds and never breathe with scale'
            echo '- v124 stable tray proxy and Trash/Show Apps input proxies remain unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ready-to-install extension
        uses: actions/upload-artifact@v4
        with:
          name: dash-to-dock-macos-native-v126-static-compact-tray
          path: _build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
