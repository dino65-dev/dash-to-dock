name: Apply macOS Material v108

'on':
  push:
    branches:
      - feature/macos-material-v108
    paths:
      - .github/workflows/apply-macos-material-v108.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate v108 renderer
    runs-on: ubuntu-latest

    steps:
      - name: Check out v108 branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-material-v108
          fetch-depth: 0

      - name: Apply guarded renderer integration
        run: |
          python3 tools/apply_macos_material_v108.py
          python3 tools/fix_macos_material_v108.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sassc gettext libglib2.0-bin zip
          sudo npm install eslint@9.x -g

      - name: Validate patch whitespace
        run: git diff --check

      - name: Compile extension
        run: |
          make clean
          make

      - name: Syntax check JavaScript
        run: |
          node --check extension.js
          node --check macDockEffects.js
          node --check macPrefs.js
          node --check prefs.js

      - name: Normalize repository JavaScript style
        run: |
          ESLINT_USE_FLAT_CONFIG=false eslint --fix macDockEffects.js macPrefs.js prefs.js
          git diff --check

      - name: Lint JavaScript
        run: make check

      - name: Build package tree
        run: make _build

      - name: Validate packaged extension
        run: |
          test -f _build/metadata.json
          test -f _build/extension.js
          test -f _build/macDockEffects.js
          test -f _build/macPrefs.js
          test -f _build/prefs.js
          test -f _build/schemas/gschemas.compiled
          python3 -m json.tool _build/metadata.json >/dev/null
          glib-compile-schemas --strict _build/schemas

      - name: Commit validated production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macDockEffects.js macPrefs.js prefs.js Makefile \
            schemas/org.gnome.shell.extensions.dash-to-dock.macos.gschema.xml
          git commit -m "Add frosted material, reflections and adaptive dock decorations"
          git push origin HEAD:feature/macos-material-v108
