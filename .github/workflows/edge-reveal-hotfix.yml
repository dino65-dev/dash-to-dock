name: Apply native dock X11 edge reveal hotfix

on:
  push:
    branches:
      - feature/macos-fisheye
    paths:
      - .github/workflows/edge-reveal-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-fisheye
          fetch-depth: 0

      - name: Patch reliable screen-edge reveal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('macDockEffects.js')
          s = p.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              "const MATERIAL_HIDDEN_SLIDE = 0.035;\nconst DOT_SIZE = 4;",
              "const MATERIAL_HIDDEN_SLIDE = 0.035;\n"
              "const EDGE_REVEAL_TOLERANCE = 2;\n"
              "const DOT_SIZE = 4;")

          old_capture = """    _onCapturedEvent(event) {
              if (this._destroyed || this._dragging || !event ||
                  this._isDockFullyHidden())
                  return Clutter.EVENT_PROPAGATE;

              let type;
              try {
                  type = event.type();
              } catch {
                  return Clutter.EVENT_PROPAGATE;
              }

              if (type !== Clutter.EventType.BUTTON_PRESS)
                  return Clutter.EVENT_PROPAGATE;

              const [x, y] = event.get_coords();
"""
          new_capture = """    _onCapturedEvent(event) {
              if (this._destroyed || this._dragging || !event)
                  return Clutter.EVENT_PROPAGATE;

              let type;
              try {
                  type = event.type();
              } catch {
                  return Clutter.EVENT_PROPAGATE;
              }

              // The detached renderer must not depend on the hidden native Dock
              // actor being pickable. Stage capture sees pointer motion before
              // it reaches windows, so Mac mode can request native reveal here.
              if (type === Clutter.EventType.MOTION) {
                  const [x, y] = event.get_coords();
                  this._maybeRevealFromEdge(x, y);
                  return Clutter.EVENT_PROPAGATE;
              }

              if (this._isDockFullyHidden() ||
                  type !== Clutter.EventType.BUTTON_PRESS)
                  return Clutter.EVENT_PROPAGATE;

              const [x, y] = event.get_coords();
"""
          replace_once(old_capture, new_capture)

          anchor = """    _onCapturedEvent(event) {
"""
          helper = """    _maybeRevealFromEdge(pointerX, pointerY) {
              if (!this._isDockFullyHidden() || Main.overview.visibleTarget)
                  return;

              // Manual-hide should stay manual. Fixed docks never reach this state.
              if (!this._dock?._autohideIsEnabled &&
                  !this._dock?._intellihideIsEnabled)
                  return;

              const monitor = this._dock?._monitor;
              if (!monitor || monitor.inFullscreen)
                  return;

              const left = monitor.x;
              const right = monitor.x + monitor.width - 1;
              const top = monitor.y;
              const bottom = monitor.y + monitor.height - 1;
              const tolerance = EDGE_REVEAL_TOLERANCE;
              const insideX = pointerX >= left && pointerX <= right;
              const insideY = pointerY >= top && pointerY <= bottom;
              let onEdge = false;

              switch (this._dock.position) {
              case St.Side.LEFT:
                  onEdge = insideY && pointerX <= left + tolerance;
                  break;
              case St.Side.RIGHT:
                  onEdge = insideY && pointerX >= right - tolerance;
                  break;
              case St.Side.TOP:
                  onEdge = insideX && pointerY <= top + tolerance;
                  break;
              case St.Side.BOTTOM:
              default:
                  onEdge = insideX && pointerY >= bottom - tolerance;
                  break;
              }

              if (!onEdge)
                  return;

              // Keep Dash-to-Dock authoritative for the actual animation/state.
              this._materialRect = null;
              this._wake();
              this._dock._show?.();
          }

"""
          if s.count(anchor) != 1:
              raise SystemExit('Could not find _onCapturedEvent insertion point')
          s = s.replace(anchor, helper + anchor, 1)

          p.write_text(s)
          PY

      - name: Validate source patch
        run: |
          node --check macDockEffects.js
          git diff --check

      - name: Commit renderer fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macDockEffects.js
          git commit -m "Fix native macOS dock X11 edge reveal"
          git push origin HEAD:feature/macos-fisheye
