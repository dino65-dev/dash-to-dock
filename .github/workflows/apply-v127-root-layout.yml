---
name: Apply v127 root layout

'on':
  push:
    branches:
      - feature/macos-root-layout-v127
    paths:
      - .github/v127-root-layout.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed root-layout patch
        run: |
          git apply --check .github/v127-root-layout.patch
          git apply .github/v127-root-layout.patch
          node --check macDockInteractions.js
          node --check macDirectInputStability.js
          node --check macThumbnailFisheyeBase.js
          node --check macTrayLayout.js

      - name: Commit root-layout rewrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add macDockInteractions.js macDirectInputStability.js macThumbnailFisheyeBase.js
          git commit -m 'Rebuild minimized tray around canonical layout geometry'
          git push origin HEAD:feature/macos-root-layout-v127
