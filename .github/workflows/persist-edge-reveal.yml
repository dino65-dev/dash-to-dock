---
name: Persist X11 Edge Reveal

'on':
  push:
    branches:
      - feature/macos-fisheye
    paths:
      - .github/workflows/persist-edge-reveal.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-fisheye
          fetch-depth: 0

      - name: Patch renderer source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('macDockEffects.js')
          s = p.read_text()

          if 'const EDGE_REVEAL_TOLERANCE = 2;' not in s:
              old = 'const MATERIAL_HIDDEN_SLIDE = 0.035;\nconst DOT_SIZE = 4;'
              new = ('const MATERIAL_HIDDEN_SLIDE = 0.035;\n'
                     'const EDGE_REVEAL_TOLERANCE = 2;\n'
                     'const DOT_SIZE = 4;')
              if s.count(old) != 1:
                  raise SystemExit('Could not locate constants')
              s = s.replace(old, new, 1)

              old_capture = '\n'.join([
                  '    _onCapturedEvent(event) {',
                  '        if (this._destroyed || this._dragging || !event ||',
                  '            this._isDockFullyHidden())',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '',
                  '        let type;',
                  '        try {',
                  '            type = event.type();',
                  '        } catch {',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '        }',
                  '',
                  '        if (type !== Clutter.EventType.BUTTON_PRESS)',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '',
                  '        const [x, y] = event.get_coords();',
              ]) + '\n'
              new_capture = '\n'.join([
                  '    _onCapturedEvent(event) {',
                  '        if (this._destroyed || this._dragging || !event)',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '',
                  '        let type;',
                  '        try {',
                  '            type = event.type();',
                  '        } catch {',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '        }',
                  '',
                  '        // Stage capture sees pointer motion before it reaches windows.',
                  '        if (type === Clutter.EventType.MOTION) {',
                  '            const [x, y] = event.get_coords();',
                  '            this._maybeRevealFromEdge(x, y);',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '        }',
                  '',
                  '        if (this._isDockFullyHidden() ||',
                  '            type !== Clutter.EventType.BUTTON_PRESS)',
                  '            return Clutter.EVENT_PROPAGATE;',
                  '',
                  '        const [x, y] = event.get_coords();',
              ]) + '\n'
              if s.count(old_capture) != 1:
                  raise SystemExit('Could not locate captured-event block')
              s = s.replace(old_capture, new_capture, 1)

              helper = '\n'.join([
                  '    _maybeRevealFromEdge(pointerX, pointerY) {',
                  '        if (!this._isDockFullyHidden() || Main.overview.visibleTarget)',
                  '            return;',
                  '',
                  '        if (!this._dock?._autohideIsEnabled &&',
                  '            !this._dock?._intellihideIsEnabled)',
                  '            return;',
                  '',
                  '        const monitor = this._dock?._monitor;',
                  '        if (!monitor || monitor.inFullscreen)',
                  '            return;',
                  '',
                  '        const left = monitor.x;',
                  '        const right = monitor.x + monitor.width - 1;',
                  '        const top = monitor.y;',
                  '        const bottom = monitor.y + monitor.height - 1;',
                  '        const tolerance = EDGE_REVEAL_TOLERANCE;',
                  '        const insideX = pointerX >= left && pointerX <= right;',
                  '        const insideY = pointerY >= top && pointerY <= bottom;',
                  '        let onEdge = false;',
                  '',
                  '        switch (this._dock.position) {',
                  '        case St.Side.LEFT:',
                  '            onEdge = insideY && pointerX <= left + tolerance;',
                  '            break;',
                  '        case St.Side.RIGHT:',
                  '            onEdge = insideY && pointerX >= right - tolerance;',
                  '            break;',
                  '        case St.Side.TOP:',
                  '            onEdge = insideX && pointerY <= top + tolerance;',
                  '            break;',
                  '        case St.Side.BOTTOM:',
                  '        default:',
                  '            onEdge = insideX && pointerY >= bottom - tolerance;',
                  '            break;',
                  '        }',
                  '',
                  '        if (!onEdge)',
                  '            return;',
                  '',
                  '        this._materialRect = null;',
                  '        this._wake();',
                  '        this._dock._show?.();',
                  '    }',
                  '',
              ]) + '\n'
              anchor = '    _onCapturedEvent(event) {\n'
              if s.count(anchor) != 1:
                  raise SystemExit('Could not locate helper insertion point')
              s = s.replace(anchor, helper + anchor, 1)
              p.write_text(s)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check macDockEffects.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macDockEffects.js
          if git diff --cached --quiet; then
            echo 'Renderer already contains edge reveal fix.'
            exit 0
          fi
          git commit -m "Fix native macOS dock X11 edge reveal"
          git push origin HEAD:feature/macos-fisheye
